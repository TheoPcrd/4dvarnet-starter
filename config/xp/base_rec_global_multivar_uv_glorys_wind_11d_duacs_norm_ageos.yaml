    var_path: /Odyssey/private/t22picar/data/era5/era5_2019_dailymean_4th.nc
    #mask_path: /Odyssey/public/glorys/obs_masks/global_obs_6sats_masks_2022.pickle
    var_name: v10
    input_arch: prior_input
    output_arch: no_output
    broadcast_time: False
  uo:
    #var_path: /Odyssey/private/t22picar/data/glorys_15m/glorys_15.81m_2019-01-01-2020-01-01_4th.nc
    var_path: /Odyssey/private/t22picar/data/glorys_15m/glorys_multivar_15m_2010-2018.nc
    var_name: uo
    input_arch: no_input
    output_arch: full_output
    broadcast_time: False
  vo:
    #var_path: /Odyssey/private/t22picar/data/glorys_15m/glorys_15.81m_2019-01-01-2020-01-01_4th.nc
    var_path: /Odyssey/private/t22picar/data/glorys_15m/glorys_multivar_15m_2010-2018.nc
    #mask_path: /Odyssey/public/glorys/obs_masks/global_obs_6sats_masks_2022.pickle
    var_name: vo
    input_arch: no_input
    output_arch: full_output
    broadcast_time: False

multivar_selector:
  _target_: contrib.multivar.multivar_utils.MultivarBatchSelector

domain:
  train:
    lat:
      _target_: builtins.slice
      _args_:
      - -80
      - 90
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180
  test:
    lat:
      _target_: builtins.slice
      _args_:
      - -79
      - 89
    lon:
      _target_: builtins.slice
      _args_:
      - -179
      - 179

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 350
  limit_train_batches: 102
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_total_mse
      save_top_k: 3
      filename: '{val_total_mse:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.multivar.multivar_data.MultivarDataModule
  multivar_da: 
    _target_: contrib.data_loading.data.open_multivar_datasets
    vars_info: ${multivar}
    domain: ${domain.train}
    full_time_domain: ${datamodule.domains}
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2019-01-01', '2019-01-01']}
    val: 
      time: {_target_: builtins.slice, _args_: ['2019-01-01', '2019-02-01']}
    test: 
      time: {_target_: builtins.slice,  _args_: ['2019-12-01', '2019-12-01']}
  xrds_kw:
    patch_dims: { time: 11, lat: 680, lon: 1440}
    strides: { time: 1, lat: 672, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 8}
  #norm_stats: [[-1.39947670e-01,  1.38521581e+01, -7.87059148e-03, -2.79030473e-01,
  #     -1.51604884e-03,  8.53338346e-03],[ 0.72084153, 11.67357655,  5.02776089,  4.33204108,  0.17698882,
  #      0.14522934]]
#15m
  #norm_stats: [[-1.57375389e-01,  1.40099629e+01,  1.49226288e-02,  1.72673578e-01,
  #     -4.83297373e-03,  2.73179771e-03],[ 0.72239659, 11.67054815,  5.28805702,  4.26651655,  0.05388005,
  #      0.04949983]]
  #0m
  norm_stats : [[-1.57375389e-01,  1.40099629e+01,  1.49226288e-02,  1.72673578e-01,
       -6.67386633e-03,  4.30569108e-03],[ 0.72239659, 11.67054815,  5.28805702,  4.26651655,  0.07774616,
        0.05941471]]
model:
  _target_: contrib.multivar.multivar_models_unet.MultivarUNet
  multivar_selector: ${multivar_selector}
  persist_rw: False
  opt_fn:
    _target_: contrib.multivar.multivar_models_unet.cosanneal_lr_adam_unet
    _partial_: true
    lr: 1e-3
    T_max: ${trainer.max_epochs}
  rec_weight:
      _target_: contrib.multivar.multivar_utils.get_multivar_mapping_wei
      patch_dims: ${datamodule.xrds_kw.patch_dims}
      crop: {time: 0, lat: 0, lon: 0}
      dims_out:
        _target_: contrib.multivar.multivar_utils.get_multivar_prior_dims_out
        multivar_dict: ${multivar}
        channels_per_dim: ${datamodule.xrds_kw.patch_dims.time}
      offset: 1

  #rec_weight_fn:
  #  _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
  #  _partial_: True
  #  soft_edge: 0.25
  solver:
