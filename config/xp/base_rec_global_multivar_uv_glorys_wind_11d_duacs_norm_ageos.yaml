# @package _global_

multivar:
  ssh:
    var_path: /Odyssey/private/t22picar/data/ssh_L4/SSH_L4_CMEMS_2019_4th.nc
    #mask_path: /Odyssey/public/glorys/obs_masks/global_obs_6sats_masks_2022.pickle
